<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tiendita — IE N° 0148 MVRHDT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, doc, getDoc, getDocs, setDoc,
    updateDoc, addDoc, deleteDoc, query, orderBy, serverTimestamp,
    runTransaction, where, limit
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  /* ══════════════════════════════════════
     🔧 CONFIGURACIÓN FIREBASE
     ══════════════════════════════════════ */
  const firebaseConfig = {
    apiKey:            "AIzaSyBdz5Cptq0TD6dPVox3yY0zZ3yi_7txNxA",
    authDomain:        "tienda-aip.firebaseapp.com",
    projectId:         "tienda-aip",
    storageBucket:     "tienda-aip.firebasestorage.app",
    messagingSenderId: "141367494309",
    appId:             "1:141367494309:web:0e663a5ba26ba60bd1ef4c"
  };

  /* ── Ciclos CNEB Secundaria ── */
  const CICLO = { "1ro":"VI","2do":"VI","3ro":"VII","4to":"VII","5to":"VII" };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  /* ── Función de escape para prevenir XSS ── */
  function escapeHtml(unsafe) {
    return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  /* ── Estado global ── */
  let currentUser = null;
  let currentRole = null;
  let allItems    = [];
  let storeStatus = { open:false, bimestre:"" };
  let canjeTarget = null;
  let ptsTarget   = null;
  let khanPts     = 0;

  const $   = id => document.getElementById(id);
  const fmt = d  => d ? new Date(d.seconds ? d.seconds*1000 : d).toLocaleDateString("es-PE") : "—";

  /* ── Bimestre actual ── */
  const bimestreActual = () => {
    const n = new Date();
    const m = n.getMonth() + 1;
    const a = n.getFullYear();
    const num = m <= 2 ? 1 : m <= 4 ? 2 : m <= 6 ? 3 : m <= 8 ? 4 : m <= 10 ? 5 : 6;
    return `${a}-B${num}`;
  };

  const bimestreLabel = (clave) => {
    if (!clave) return "—";
    const meses = [
      ["Ene-Feb","Enero-Febrero"],["Mar-Abr","Marzo-Abril"],
      ["May-Jun","Mayo-Junio"],["Jul-Ago","Julio-Agosto"],
      ["Set-Oct","Setiembre-Octubre"],["Nov-Dic","Noviembre-Diciembre"]
    ];
    const m = clave.match(/(\d{4})-B(\d)/);
    if (!m) return clave;
    const idx = parseInt(m[2]) - 1;
    return `${meses[idx]?.[1] || "Bimestre "+m[2]} ${m[1]}`;
  };

  /* ── Hash SHA-256 (seguridad de contraseñas) ── */
  async function hashPwd(pwd) {
    const enc = new TextEncoder();
    const buf = await crypto.subtle.digest("SHA-256", enc.encode(pwd));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }

  /* ── Verificar contraseña (compatible con cuentas antiguas sin hash) ── */
  async function checkPwd(stored, input) {
    if (stored.length === 64 && /^[0-9a-f]+$/.test(stored)) {
      return stored === await hashPwd(input);
    }
    return stored === input; // compatibilidad con cuentas antiguas
  }

  function showMsg(id,txt,type){
    const el=$(id); if(!el)return;
    el.textContent=txt; el.className="msg "+type;
    setTimeout(()=>{el.className="msg";el.textContent="";},3500);
  }

  function calcKhanPts(min,ej){
    let p=0;
    p+=Math.floor(min/10)*5;
    p+=ej*5;
    if(ej>=4) p+=10;
    return p;
  }

  /* ════════════════════════════
     LOGIN
  ════════════════════════════ */
  window.setLoginTab = tab => {
    document.querySelectorAll(".tab-btn").forEach((b,i)=>
      b.classList.toggle("active",(i===0&&tab==="student")||(i===1&&tab==="admin")));
    $("loginStudent").style.display=tab==="student"?"":"none";
    $("loginAdmin").style.display=tab==="admin"?"":"none";
  };
  window.toggleRegister = show => {
    $("registerForm").style.display=show?"":"none";
    $("loginForm").style.display=show?"none":"";
  };

  window.registrar = async () => {
    const username=$("regUser").value.trim().toLowerCase().replace(/\s+/g,"_");
    const pass=$("regPass").value;
    const grado=$("regGrado").value;
    const seccion=$("regSeccion").value;
    const nombre=$("regNombre").value.trim();
    if(!username||!pass||!nombre) return showMsg("msgLogin","Completa todos los campos","error");
    if(pass.length<4) return showMsg("msgLogin","Contraseña mínimo 4 caracteres","error");
    if(!/^[a-z0-9_]+$/.test(username)) return showMsg("msgLogin","Solo letras minúsculas, números y guión bajo","error");
    const snap=await getDoc(doc(db,"students",username));
    if(snap.exists()) return showMsg("msgLogin","Ese usuario ya existe, elige otro","error");
    const ciclo=CICLO[grado]||"VI";
    const hashed = await hashPwd(pass);
    await setDoc(doc(db,"students",username),{
      username, pass:hashed, nombre, grado, seccion, ciclo, pts:0,
      createdAt:serverTimestamp(), khanData:{minutos:0,ejerciciosAprobados:0}
    });
    showMsg("msgLogin","¡Cuenta creada! Ya puedes ingresar","success");
    toggleRegister(false);
  };

  window.loginStudent = async () => {
    const username=$("loginUser").value.trim().toLowerCase();
    const pass=$("loginPass").value;
    if(!username||!pass) return showMsg("msgLogin","Completa los campos","error");
    const snap=await getDoc(doc(db,"students",username));
    if(!snap.exists()) return showMsg("msgLogin","Usuario no encontrado","error");
    const data=snap.data();
    const ok = await checkPwd(data.pass, pass);
    if(!ok) return showMsg("msgLogin","Contraseña incorrecta","error");
    currentUser={id:username,...data};
    currentRole="student";
    await loadStoreStatus();
    showStudentDash();
  };

  window.loginAdmin = async () => {
    const inputPass = $("adminPass").value;
    if(!inputPass) return showMsg("msgLogin","Ingresa la contraseña","error");
    /* Verificar contra Firestore config/admin */
    const snap = await getDoc(doc(db,"config","admin"));
    if(!snap.exists()){
      /* Primera vez: crear con hash de la contraseña por defecto */
      const defHash = await hashPwd("aip0148admin");
      await setDoc(doc(db,"config","admin"),{passHash:defHash});
      const ok = await checkPwd(defHash, inputPass);
      if(!ok) return showMsg("msgLogin","Contraseña incorrecta","error");
    } else {
      const ok = await checkPwd(snap.data().passHash, inputPass);
      if(!ok) return showMsg("msgLogin","Contraseña incorrecta","error");
    }
    currentRole="admin";
    showAdminDash();
  };

  window.logout = () => {
    currentUser=null; currentRole=null;
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    $("loginScreen").classList.add("active");
  };

  /* ════════════════════════════
     TIENDA STATUS
  ════════════════════════════ */
  async function loadStoreStatus(){
    const snap=await getDoc(doc(db,"config","tienda"));
    storeStatus=snap.exists()?snap.data():{open:false,bimestre:""};
  }

  /* ════════════════════════════
     ESTUDIANTE
  ════════════════════════════ */
  async function showStudentDash(){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    $("studentScreen").classList.add("active");
    await refreshStudent();
    setStuTab("inicio");
  }

  async function refreshStudent(){
    const snap=await getDoc(doc(db,"students",currentUser.id));
    currentUser={id:currentUser.id,...snap.data()};
    const s=currentUser;
    $("navPts").textContent=s.pts+" pts";
    $("navUser").textContent=s.nombre+" · "+s.grado+"° "+s.seccion+" · Ciclo "+s.ciclo;
    $("stu-pts-total").textContent=s.pts;
    $("stu-ciclo-badge").textContent="Ciclo "+s.ciclo+" — "+(s.ciclo==="VI"?"1ro y 2do de Secundaria":"3ro, 4to y 5to de Secundaria");
    
    // Obtener acumulado del bimestre actual desde khanWeeks
    const bim = bimestreActual();
    const weeksSnap = await getDocs(query(
      collection(db,"students",currentUser.id,"khanWeeks"),
      where("bimestre","==",bim)
    ));
    let totalMin = 0, totalEjer = 0;
    weeksSnap.forEach(doc => {
      const d = doc.data();
      totalMin += d.minutos || 0;
      totalEjer += d.ejercicios || 0;
    });
    // También sumar lo actual no guardado aún (khanData)
    const k = s.khanData || {};
    totalMin += k.minutos || 0;
    totalEjer += k.ejerciciosAprobados || 0;

    $("prog-min").style.width=Math.min(100,(totalMin/120)*100)+"%";
    $("prog-min-lbl").textContent=totalMin+" min (bimestre)";
    $("p-min-txt").textContent=totalMin+" min";
    $("prog-ej").style.width=Math.min(100,(totalEjer/4)*100)+"%";
    $("prog-ej-lbl").textContent=totalEjer+" ejercicios";
    $("p-ej-txt").textContent=totalEjer+" ejercicios";
  }

  window.setStuTab = async tab => {
    document.querySelectorAll(".stu-tab").forEach((b,i)=>
      b.classList.toggle("active",["inicio","tienda","ranking","historial"][i]===tab));
    document.querySelectorAll(".stu-panel").forEach(p=>p.classList.remove("active"));
    $("stu-"+tab).classList.add("active");
    if(tab==="tienda"){await loadStoreStatus();renderTienda();}
    if(tab==="ranking") renderRanking();
    if(tab==="historial") loadHistorial();
  };

  async function renderTienda(){
    const c=$("items-container"); const banner=$("store-banner");
    if(!storeStatus.open){
      banner.innerHTML=`<div class="store-closed">
        <div class="sc-icon">🔒</div>
        <div class="sc-title">Tienda cerrada</div>
        <div class="sc-sub">El profesor abrirá la tienda al finalizar el bimestre para que puedas canjear tus puntos acumulados.</div>
      </div>`; c.innerHTML=""; return;
    }
    banner.innerHTML=`<div class="store-open-banner">✅ Tienda abierta — ${bimestreLabel(storeStatus.bimestre)}</div>`;
    const snap=await getDocs(collection(db,"items"));
    allItems=snap.docs.map(d=>({id:d.id,...d.data()}));
    const s=currentUser;
    if(!allItems.length){c.innerHTML='<p class="empty">No hay premios disponibles</p>';return;}
    c.innerHTML=allItems.map(item=>{
      const ok=s.pts>=item.pts&&item.stock>0;
      return `<div class="item-card ${ok?"can-afford":""}">
        <div class="item-emoji">${escapeHtml(item.emoji||"🎁")}</div>
        <div class="item-name">${escapeHtml(item.name)}</div>
        <div class="item-pts">${item.pts} pts</div>
        <div class="item-stock">${item.stock>98?"∞":item.stock} disponibles</div>
        <button class="btn-canjear" ${!ok?"disabled":""} onclick="abrirCanje('${item.id}')">
          ${item.stock===0?"Agotado":!ok?"Faltan pts":"Canjear"}
        </button>
      </div>`;
    }).join("");
  }

  async function renderRanking(){
    const cicloU = currentUser.ciclo;
    const q = query(
      collection(db,"students"),
      where("ciclo","==",cicloU),
      orderBy("pts","desc"),
      limit(50)
    );
    const snap = await getDocs(q);
    const mismo = snap.docs.map(d=>({id:d.id,...d.data()}));
    const c=$("ranking-container");
    if(!mismo.length){c.innerHTML='<p class="empty">Sin estudiantes en tu ciclo aún</p>';return;}
    c.innerHTML=`
      <div class="ranking-header">
        <span class="rank-ciclo-badge">Ciclo ${cicloU}</span>
        <span class="rank-count">Top 50 de ${mismo.length} estudiantes</span>
      </div>
      ${mismo.map((s,i)=>{
        const isMe=s.id===currentUser.id;
        const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":"";
        return `<div class="rank-row ${isMe?"rank-me":""}">
          <div class="rank-pos">${medal||"#"+(i+1)}</div>
          <div class="rank-info">
            <div class="rank-name">${escapeHtml(s.nombre)}${isMe?' <span class="rank-you">(tú)</span>':""}</div>
            <div class="rank-detail">${escapeHtml(s.grado)}° ${escapeHtml(s.seccion)}</div>
          </div>
          <div class="rank-pts">${s.pts} pts</div>
        </div>`;
      }).join("")}`;
  }

  async function loadHistorial(){
    const q=query(collection(db,"students",currentUser.id,"history"),orderBy("fecha","desc"));
    const snap=await getDocs(q);
    const c=$("historial-container");
    if(snap.empty){c.innerHTML='<p class="empty">Sin movimientos aún</p>';return;}
    c.innerHTML=snap.docs.map(d=>{
      const h=d.data();
      return `<div class="hist-item">
        <div><div class="hist-name">${escapeHtml(h.desc)}</div><div class="hist-date">${fmt(h.fecha)}</div></div>
        <div class="hist-pts ${h.pts>0?"positive":"negative"}">${h.pts>0?"+":""}${h.pts} pts</div>
      </div>`;
    }).join("");
  }

  window.abrirCanje = id => {
    canjeTarget=allItems.find(i=>i.id===id); if(!canjeTarget)return;
    $("modal-title").textContent="Canjear: "+escapeHtml(canjeTarget.name)+" "+(escapeHtml(canjeTarget.emoji||""));
    $("modal-body").textContent="Se descontarán "+canjeTarget.pts+" puntos de tu cuenta. ¿Confirmas?";
    $("modalCanje").classList.add("open");
  };
  window.closeModal=()=>{$("modalCanje").classList.remove("open");canjeTarget=null;};

  /* Canje con transacción Firestore y verificación bimestral */
  window.confirmarCanje = async () => {
    if(!canjeTarget)return;
    if(!storeStatus.open){closeModal();return alert("La tienda está cerrada en este momento.");}
    const s=currentUser;
    if(s.pts<canjeTarget.pts){closeModal();return;}

    // Verificar si ya canjeó este bimestre (opcional, según reglas)
    const bim = bimestreActual();
    const canjesSnap = await getDocs(query(
      collection(db,"canjes"),
      where("userId","==",s.id),
      where("bimestre","==",bim)
    ));
    if(!canjesSnap.empty){
      closeModal();
      alert("Ya has realizado un canje este bimestre. Solo se permite uno por bimestre.");
      return;
    }

    try {
      await runTransaction(db, async (tx) => {
        const stuRef  = doc(db,"students",s.id);
        const itemRef = doc(db,"items",canjeTarget.id);
        const stuSnap  = await tx.get(stuRef);
        const itemSnap = await tx.get(itemRef);
        if(!stuSnap.exists()) throw new Error("Estudiante no encontrado");
        if(!itemSnap.exists()) throw new Error("Premio no encontrado");
        const stuData  = stuSnap.data();
        const itemData = itemSnap.data();
        if(stuData.pts < itemData.pts) throw new Error("Puntos insuficientes");
        if(itemData.stock < 99 && itemData.stock <= 0) throw new Error("Premio agotado");
        tx.update(stuRef,{pts: stuData.pts - itemData.pts});
        if(itemData.stock < 99) tx.update(itemRef,{stock: itemData.stock - 1});
      });
      /* Registrar historial y canje */
      await addDoc(collection(db,"students",s.id,"history"),{
        desc:"Canje: "+canjeTarget.name, pts:-canjeTarget.pts,
        fecha:serverTimestamp(), tipo:"canje"
      });
      await addDoc(collection(db,"canjes"),{
        userId:s.id, nombre:s.nombre, grado:s.grado, seccion:s.seccion, ciclo:s.ciclo,
        item:canjeTarget.name, emoji:canjeTarget.emoji||"🎁", pts:canjeTarget.pts,
        fecha:serverTimestamp(), bimestre:bim
      });
      closeModal();
      await refreshStudent();
      await renderTienda();
    } catch(e){
      closeModal();
      alert("No se pudo completar el canje: "+e.message);
    }
  };

  /* ════════════════════════════
     ADMIN
  ════════════════════════════ */
  async function showAdminDash(){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    $("adminScreen").classList.add("active");
    await loadStoreStatus();
    renderStoreToggle();
    setAdminTab("estudiantes");
  }

  function renderStoreToggle(){
    const btn=$("btn-store-toggle"); const lbl=$("store-status-lbl");
    if(storeStatus.open){
      btn.textContent="🔒 Cerrar tienda"; btn.className="btn-store danger";
      lbl.innerHTML='<span class="status-open">● ABIERTA</span> — '+bimestreLabel(storeStatus.bimestre||"");
    } else {
      btn.textContent="🔓 Abrir tienda del bimestre"; btn.className="btn-store success";
      lbl.innerHTML='<span class="status-closed">● CERRADA</span>';
    }
  }

  window.toggleStore = async () => {
    const newOpen=!storeStatus.open;
    storeStatus={open:newOpen, bimestre:newOpen?bimestreActual():""};
    await setDoc(doc(db,"config","tienda"),storeStatus);
    renderStoreToggle();
    alert(newOpen?"✅ Tienda ABIERTA. Los estudiantes ya pueden canjear sus puntos.":"🔒 Tienda CERRADA.");
  };

  window.setAdminTab = tab => {
    document.querySelectorAll(".admin-tab").forEach((b,i)=>
      b.classList.toggle("active",["estudiantes","khan","premios","canjes"][i]===tab));
    document.querySelectorAll(".admin-panel").forEach(p=>p.classList.remove("active"));
    $("admin-"+tab).classList.add("active");
    if(tab==="estudiantes") adminEstudiantes();
    if(tab==="khan")        adminKhan();
    if(tab==="premios")     adminPremios();
    if(tab==="canjes")      adminCanjes();
  };

  async function adminEstudiantes(){
    // Leer solo los primeros 200 por ciclo para evitar sobrecarga (paginación opcional)
    const snapVI = await getDocs(query(collection(db,"students"), where("ciclo","==","VI"), orderBy("grado"), orderBy("seccion"), orderBy("nombre"), limit(200)));
    const snapVII = await getDocs(query(collection(db,"students"), where("ciclo","==","VII"), orderBy("grado"), orderBy("seccion"), orderBy("nombre"), limit(200)));
    const vi = snapVI.docs.map(d=>({id:d.id,...d.data()}));
    const vii = snapVII.docs.map(d=>({id:d.id,...d.data()}));
    
    const filas=lista=>lista.length?lista.map(s=>`<tr>
        <td><code class="code-chip">${escapeHtml(s.username||s.id)}</code></td>
        <td>${escapeHtml(s.nombre)}</td>
        <td>${escapeHtml(s.grado)}° ${escapeHtml(s.seccion)}</td>
        <td><strong>${s.pts}</strong></td>
        <td>
          <button class="btn-pts" onclick="abrirPtsModal('${s.id}','${escapeHtml(s.nombre).replace(/'/g,"\\'")}')">+ Puntos</button>
          <button class="btn-danger" onclick="eliminarEst('${s.id}','${escapeHtml(s.nombre).replace(/'/g,"\\'")}')">Eliminar</button>
        </td>
      </tr>`).join("")
      :'<tr><td colspan="5" class="empty-td">Sin estudiantes registrados</td></tr>';
    $("tbody-vi").innerHTML=filas(vi);
    $("count-vi").textContent=vi.length+" estudiante"+(vi.length!==1?"s":"");
    $("tbody-vii").innerHTML=filas(vii);
    $("count-vii").textContent=vii.length+" estudiante"+(vii.length!==1?"s":"");
  }

  window.eliminarEst = async (id,nombre) => {
    if(!confirm("¿Eliminar a "+nombre+"? No se puede deshacer."))return;
    await deleteDoc(doc(db,"students",id));
    adminEstudiantes();
  };

  async function adminKhan(){
    const snap=await getDocs(query(collection(db,"students"), orderBy("nombre"), limit(300)));
    const all=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.nombre.localeCompare(b.nombre));
    $("khan-student").innerHTML=all.length
      ?all.map(s=>`<option value="${s.id}">${escapeHtml(s.nombre)} — ${escapeHtml(s.grado)}° ${escapeHtml(s.seccion)} (Ciclo ${escapeHtml(s.ciclo)})</option>`).join("")
      :"<option>Sin estudiantes</option>";
    $("khan-preview").style.display="none"; khanPts=0;
  }

  window.calcularKhan = () => {
    const min=parseInt($("khan-minutos").value)||0;
    const ej=parseInt($("khan-ejercicios").value)||0;
    if(ej<0||ej>4)return alert("Los ejercicios aprobados deben ser entre 0 y 4.");
    khanPts=calcKhanPts(min,ej);
    $("khan-desglose").innerHTML=
      "• Minutos: "+Math.floor(min/10)*5+" pts ("+Math.floor(min/10)+" bloques de 10 min)<br>"+
      "• Ejercicios aprobados ("+ej+"×5): "+ej*5+" pts<br>"+
      (ej>=4?"• Bonus todos completos: +10 pts<br>":"")+
      "<strong>Total a asignar: "+khanPts+" pts</strong>";
    $("khan-preview").style.display="";
  };

  window.asignarKhan = async () => {
    if(khanPts<=0)return alert("Primero calcula los puntos.");
    const userId=$("khan-student").value;
    const min=parseInt($("khan-minutos").value)||0;
    const ej=parseInt($("khan-ejercicios").value)||0;
    const semana=$("khan-semana").value||"Semana registrada";
    const snap=await getDoc(doc(db,"students",userId));
    if(!snap.exists())return alert("Estudiante no encontrado.");
    const s=snap.data();
    const bim = bimestreActual();
    
    // Actualizar puntos totales y khanData (acumulado semanal actual)
    const currentKhan = s.khanData || {minutos:0,ejerciciosAprobados:0};
    await updateDoc(doc(db,"students",userId),{
      pts:(s.pts||0)+khanPts,
      khanData:{minutos:currentKhan.minutos+min, ejerciciosAprobados:currentKhan.ejerciciosAprobados+ej}
    });
    
    // Guardar registro semanal en subcolección khanWeeks (para historial bimestral)
    await addDoc(collection(db,"students",userId,"khanWeeks"),{
      semana, minutos:min, ejercicios:ej, puntosOtorgados:khanPts,
      fecha:serverTimestamp(), bimestre:bim
    });
    
    await addDoc(collection(db,"students",userId,"history"),{
      desc:"Khan Academy ("+semana+"): "+min+" min, "+ej+"/4 ejercicios ≥80%",
      pts:khanPts, fecha:serverTimestamp(), tipo:"khan"
    });
    alert("✅ "+khanPts+" pts asignados correctamente a "+s.nombre);
    $("khan-minutos").value=$("khan-ejercicios").value=$("khan-semana").value="";
    $("khan-preview").style.display="none"; khanPts=0;
    adminEstudiantes();
  };

  async function adminPremios(){
    const snap=await getDocs(collection(db,"items"));
    allItems=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.pts-b.pts);
    $("tbody-premios").innerHTML=allItems.length
      ?allItems.map(item=>`<tr>
          <td>${escapeHtml(item.emoji||"🎁")} ${escapeHtml(item.name)}</td>
          <td>${item.pts}</td>
          <td>${item.stock>98?"∞":item.stock}</td>
          <td><button class="btn-danger" onclick="eliminarPremio('${item.id}')">Eliminar</button></td>
        </tr>`).join("")
      :'<tr><td colspan="4" class="empty-td">Sin premios aún.</td></tr>';
  }

  window.agregarPremio = async () => {
    const nombre=$("premio-nombre").value.trim();
    const emoji=$("premio-emoji").value.trim()||"🎁";
    const pts=parseInt($("premio-puntos").value)||0;
    const stock=parseInt($("premio-stock").value)||0;
    if(!nombre||pts<1)return alert("Completa el nombre y los puntos.");
    await addDoc(collection(db,"items"),{name:nombre,emoji,pts,stock,createdAt:serverTimestamp()});
    $("premio-nombre").value=$("premio-emoji").value=$("premio-puntos").value=$("premio-stock").value="";
    adminPremios();
  };

  window.eliminarPremio = async id => {
    if(!confirm("¿Eliminar este premio?"))return;
    await deleteDoc(doc(db,"items",id)); adminPremios();
  };

  async function adminCanjes(){
    const q=query(collection(db,"canjes"),orderBy("fecha","desc"),limit(200));
    const snap=await getDocs(q);
    $("tbody-canjes").innerHTML=snap.empty
      ?'<tr><td colspan="6" class="empty-td">Sin canjes registrados</td></tr>'
      :snap.docs.map(d=>{
          const c=d.data();
          return `<tr>
            <td>${escapeHtml(c.nombre)}</td>
            <td>${escapeHtml(c.grado)}° ${escapeHtml(c.seccion)}</td>
            <td><span class="badge ${c.ciclo==="VI"?"badge-vi":"badge-vii"}">Ciclo ${escapeHtml(c.ciclo)}</span></td>
            <td>${escapeHtml(c.emoji||"🎁")} ${escapeHtml(c.item)}</td>
            <td>${c.pts}</td>
            <td>${fmt(c.fecha)}</td>
          </tr>`;
        }).join("");
  }

  window.abrirPtsModal=(id,nombre)=>{
    ptsTarget={id,nombre};
    $("modal-pts-user").textContent=nombre;
    $("modal-pts-val").value=""; $("modal-pts-motivo").value="";
    $("modalPts").classList.add("open");
  };
  window.closePtsModal=()=>{$("modalPts").classList.remove("open");ptsTarget=null;};

  window.confirmarPts = async () => {
    const val=parseInt($("modal-pts-val").value)||0;
    const motivo=$("modal-pts-motivo").value.trim()||"Puntos extra";
    if(val<=0)return alert("Ingresa un valor mayor a 0.");
    const snap=await getDoc(doc(db,"students",ptsTarget.id));
    const s=snap.data();
    await updateDoc(doc(db,"students",ptsTarget.id),{pts:(s.pts||0)+val});
    await addDoc(collection(db,"students",ptsTarget.id,"history"),{
      desc:motivo, pts:val, fecha:serverTimestamp(), tipo:"extra"
    });
    closePtsModal(); adminEstudiantes();
  };
</script>
